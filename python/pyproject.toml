[project]
name = "inphic-switcher"
version = "0.2.0"
description = "Inphic IN 系列鼠标的自定义驱动: 前台程序切换配置, 直接构造设备命令, 不依赖官方 HUB"
requires-python = ">=3.11"
dependencies = [
    "hidapi>=0.14",
    "psutil>=5.9",
    "PyYAML>=6.0",
    # 蓝牙(WinRT)，只在 Windows 上安装
    "winrt-runtime>=3.2; sys_platform == 'win32'",
    "winrt-Windows-Foundation>=3.2; sys_platform == 'win32'",
    "winrt-Windows-Foundation-Collections>=3.2; sys_platform == 'win32'",
    "winrt-Windows-Storage-Streams>=3.2; sys_platform == 'win32'",
    "winrt-Windows-Devices-Bluetooth>=3.2; sys_platform == 'win32'",
    "winrt-Windows-Devices-Bluetooth-GenericAttributeProfile>=3.2; sys_platform == 'win32'",
    "winrt-Windows-Devices-Enumeration>=3.2; sys_platform == 'win32'",
]

[tool.uv]
# 不打包: 代码在 inphic/ 包里, 从项目根目录用 `uv run python -m inphic ...` 直接运行; uv 只负责环境和依赖
package = false
