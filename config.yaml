# 鼠标配置。运行: uv run python -m inphic run
# 每一项怎么写、有哪些可选值，都在 docs/配置说明.md 里，每种用法有一个可以直接复制的例子。
# 方案里没写的项 = 出厂默认，所以只需要写你想改的。

poll_interval_ms: 150     # 多久检查一次前台是哪个程序
packet_delay_ms: 520      # 往鼠标发配置时，两个包之间的间隔

device:                   # 鼠标的 USB 标识，一般不用改
  vendor_id: 0x1D57
  product_id: 0xFA65
  usage_page: 0xFF00
  usage: 1
  # 蓝牙：鼠标连着蓝牙时，通过蓝牙配置鼠标（接收器可以一直插着，鼠标一次只用一条连接）。
  # 注意：蓝牙下回报率设置无效（官方也一样）；蓝牙连接时要先退出 INPHIC HUB / Inphic.exe，否则会被拒绝访问。
  # connection: auto           # auto = 蓝牙连着用蓝牙，否则用接收器；也可写 dongle（只用接收器）/ bluetooth（只用蓝牙）
  bluetooth:
    address: "78:87:11:75:9D:56"     # 鼠标的蓝牙地址（Inphic IN10）

# 宏库：宏放在 macros 目录下的 yaml 文件里，按分组整理（详见 docs/配置说明.md 第 4 节）。
# 看有哪些宏： uv run python -m inphic macros list
macro_files:
  - macros/*.yaml

profiles:
  # ---- 穿越火线用的方案 ----
  cf:
    polling_rate: 1000            # 回报率（Hz）
    light:
      mode: spectrum_cycle        # 灯光：循环呼吸
    buttons:                      # 每行：按钮名: { 绑定成什么 }
      middle_click: { type: key, key: "1" }     # 中键 → 按 1
      side_back:    { type: key, key: "6" }     # 后退侧键 → 按 6
      side_front:   { type: key, key: "5" }     # 前进侧键 → 按 5
      #3:            { type: key, key: "a" }     # 第四个键(试验: 看是不是 DPI 键) → 按 a
      # 想换成别的，把上面某一行改成下面这些之一（去掉开头的 #）：
      #   side_front: { type: key, key: "c", modifiers: [ctrl] }   # 按 Ctrl+C
      #   side_front: { type: shortcut, action: copy }             # 复制
      #   side_front: { type: media, action: volume_up }           # 音量加
      #   side_front: { type: macro, ref: fps.rapid_fire }         # 运行宏库里的宏
    dpi: 1600                     # 简写: 只用这一个 DPI

  # ---- 平时用的方案 ----
  default:
    polling_rate: 1000
    light:
      mode: off                   # 灯光：关闭
    # 按钮没写 = 出厂默认
    buttons:
      # 3:            { type: key, key: "a" }
    dpi:
      levels:  [800, 1600, 3200, 6500, 13000, 26000, 500, 500]       # 8 档的 DPI，必须是 50 的整数倍（50–26000）
      enabled: [true, true, true, true, true, true, false, false]    # 哪些档可以用鼠标上的 DPI 键切到
      current: 3                # 切到这个方案时用第几档（1–8），这里是 1600
      colors:  [[255,255,0], [0,255,255], [0,255,0], [255,0,255], [0,0,255], [255,0,0], [255,64,0], [255,255,255]]
# 切换规则：前台是哪个程序，就用哪个方案。从上往下找，第一个匹配的生效。
rules:
  - process: "crossfire.exe"      # 进入穿越火线 → cf 方案
    profile: "cf"
  - process: "*"                  # 其他所有程序 → default 方案（必须放最后）
    profile: "default"
